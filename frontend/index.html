<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            (() => {
                try {
                    const stored = localStorage.getItem('theme');
                    const dark =
                        stored === 'dark' ||
                        (stored !== 'light' &&
                            window.matchMedia('(prefers-color-scheme: dark)').matches);
                    document.documentElement.classList.toggle('dark', dark);
                    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', dark ? '#020617' : '#2563eb');
                } catch {}
            })();
        </script>
        <link rel="icon" type="png" href="favicon.ico.png" />
        <link rel="stylesheet" href="./src/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#2563eb" />
        <meta
            name="description"
            content="JuaniDev — Ignacio Carrizo, full stack developer. Projects, technologies and a little about the person behind the code."
        />
        <meta property="og:title" content="JuaniDev — Full Stack Developer" />
        <meta
            property="og:description"
            content="Portfolio of Ignacio Carrizo: projects, stack and ways to get in touch."
        />
        <meta property="og:type" content="website" />
        <title>JuaniDev — Ignacio Carrizo</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
